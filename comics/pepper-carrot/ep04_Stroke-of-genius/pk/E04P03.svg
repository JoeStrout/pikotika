         style="font-size:48px;line-height:1.25;text-align:center;text-anchor:middle"
         id="flowPara3967">tisrason tu ri pospona</flowPara><flowPara
         style="font-size:48px;line-height:1.25;text-align:center;text-anchor:middle"
         id="flowPara3969">toma a meka pensa!</flowPara></flowRoot>
  </g>
</svg>
